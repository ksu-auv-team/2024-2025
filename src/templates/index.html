<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KSU AUV Viewer</title>
        <link rel="stylesheet" href="../static/style.css" />
    </head>
    <body>
        <div class="header">
            <div class="logo-container">
                <img src="/static/imgs/logo.svg" alt="KSU AUV Logo" class="logo" />
            </div>
            <h1>KSU AUV Viewer</h1>
            <nav>
                <ul>
                    <li><a href="#" class="nav-link" data-target="cameras">Cameras</a></li>
                    <li><a href="#" class="nav-link" data-target="inputs">Inputs</a></li>
                    <li><a href="#" class="nav-link" data-target="outputs">Outputs</a></li>
                    <li><a href="#" class="nav-link" data-target="sonar">Sonar</a></li>
                    <li><a href="#" class="nav-link" data-target="batteries">Batteries</a></li>
                    <li><a href="#" class="nav-link" data-target="imu">IMU</a></li>
                    <li><a href="#" class="nav-link" data-target="sensors">Sensors</a></li>
                    <li><a href="#" class="nav-link" data-target="data-logs">Data Logs</a></li>
                </ul>
            </nav>
        </div>
        <div class="content">
            <div class="container" id="cameras">
                <h2>Cameras</h2>
                <div class="cameras">
                    <div class="camera" id="zedcam">
                        <h3>ZED Camera</h3>
                        <img src="static/imgs/placeholder.svg" alt="ZED Camera" />
                    </div>
                    <div class="camera" id="anchorcam">
                        <h3>Anchor Camera</h3>
                        <img src="/static/imgs/placeholder.svg" alt="Anchor Camera" />
                    </div>
                </div>
            </div>
            <div class="container" id="inputs">
                <h2>Inputs</h2>
                <div class="input-form">
                    <form id="input-form">
                        <label for="input-x">X:</label>
                        <input type="number" id="input-x" name="input-x" required value="0" />
                        <label for="input-y">Y:</label>
                        <input type="number" id="input-y" name="input-y" required value="0" />
                        <label for="input-z">Z:</label>
                        <input type="number" id="input-z" name="input-z" required value="0" />
                        <label for="input-yaw">Yaw:</label>
                        <input type="number" id="input-yaw" name="input-yaw" required value="0" />
                        <label for="input-pitch">Pitch:</label>
                        <input type="number" id="input-pitch" name="input-pitch" required value="0" />
                        <label for="input-roll">Roll:</label>
                        <input type="number" id="input-roll" name="input-roll" required value="0" />
                        <label for="input-s1">S1:</label>
                        <input type="number" id="input-s1" name="input-s1" required value="0" />
                        <label for="input-s2">S2:</label>
                        <input type="number" id="input-s2" name="input-s2" required value="0" />
                        <label for="input-s3">S3:</label>
                        <input type="number" id="input-s3" name="input-s3" required value="0" />
                        <button type="submit">Submit</button>
                    </form>
                    <table>
                        <thead>
                            <tr>
                                <th>Input Name</th>
                                <th>X</th>
                                <th>Y</th>
                                <th>Z</th>
                                <th>Yaw</th>
                                <th>Pitch</th>
                                <th>Roll</th>
                                <th>S1</th>
                                <th>S2</th>
                                <th>S3</th>
                                <th>timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="inputs-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="container" id="outputs">
                <h2>Outputs</h2>
            </div>
            <div class="container" id="sonar">
                <h2>Sonar</h2>
            </div>
            <div class="container" id="batteries">
                <h2>Batteries</h2>
            </div>
            <div class="container" id="imu">
                <h2>IMU</h2>
            </div>
            <div class="container" id="sensors">
                <h2>Sensors</h2>
            </div>
            <div class="container" id="data-logs">
                <h2>Data Logs</h2>
            </div>
        </div>
        <script src="../static/script.js"></script>
    </body>
</html>
